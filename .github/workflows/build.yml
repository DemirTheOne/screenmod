name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: show files
        run: find . -maxdepth 3 -not -path './.git/*' | head -60
      - name: find project folder
        id: proj
        run: |
          G=$(find . -name gradlew -not -path './.git/*' | head -n 1)
          echo "gradlew: $G"
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"
      - name: build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: chmod +x ./gradlew && ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: screenmod-jar
          path: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar
